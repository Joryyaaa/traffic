# GAT-vs-MLP controlled architecture comparison: r630, 290 segments, mzs=1.
#
# This config is shared by BOTH architectures (GAT and MLP+adj). The script
# choice determines the architecture:
#   - scripts/seed_sweep_gat.py      -> GAT + adjacency observation
#   - scripts/seed_sweep_mlp_adj.py  -> MLP + adjacency observation (same 7 features)
#
# Architecture is the ONLY independent variable. Everything else is identical:
# same frozen dataset, same reward, same action budget, same min_zone_size=1,
# same adjacency-enhanced observation, same timesteps, same seeds.
#
# Dataset: Al Nakheel, north Riyadh, r=630m — 290 street segments.
#   python scripts/fetch_osm_data.py --radius 630 --out data/raw/riyadh_r630 --lat 24.7412 --lon 46.6335
#
# Budget: max_closures=8, episode_length=20. Needs zone_builder validation
# under mzs=1 before submission.
#
seed: 42

include_adjacency_state: true

network:
  backend: madina
  streets_path: data/raw/riyadh_r630/streets.geojson
  origins_path: data/raw/riyadh_r630/residential.geojson
  destinations_path: data/raw/riyadh_r630/amenities.geojson
  origin_weight: residents
  destination_weight: floor_area
  weight_attribute: null
  crs: "EPSG:32638"
  node_snapping_tolerance: 0.5

simulation:
  search_radius: 800
  detour_ratio: 1.0
  decay: true
  decay_method: exponent
  beta: 0.003
  closest_destination: false
  turn_penalty: false
  num_cores: 1

action:
  action_type: toggle
  closure_mode: penalize
  closure_penalty: 1000.0
  max_closures: 8
  episode_length: 20
  allow_reopen: false
  allow_noop: true
  forbid_disconnection: true

reward:
  w_accessibility: 1.0
  w_flow_concentration: 0.5
  w_equity: 0.3
  w_detour: 0.2
  w_intervention: 0.05
  disconnection_penalty: 5.0

  w_pedestrian_zone: 1.0
  min_zone_size: 1
  zone_exponent: 2.0
  zone_min_flow_fraction: 0.1

  reward_mode: delta
