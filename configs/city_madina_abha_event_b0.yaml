# B0 — Baseline. Provisional reference demand; not measured traffic counts.
seed: 42

network:
  backend: madina
  streets_path: data/abha_event_hotspot/event_baseline_streets.geojson
  origins_path: data/abha_event_hotspot/event_reference_origins.geojson
  destinations_path: data/abha_event_hotspot/event_zone_destinations.geojson
  origin_weight: demand_weight
  destination_weight: destination_weight
  weight_attribute: null
  crs: "EPSG:32638"
  node_snapping_tolerance: 0.5

simulation:
  search_radius: 3500
  detour_ratio: 1.0
  decay: true
  decay_method: exponent
  beta: 0.0008
  closest_destination: false
  turn_penalty: false
  num_cores: 1

action:
  action_type: toggle
  closure_mode: rebuild
  max_closures: 0
  episode_length: 1
  allow_reopen: false
  allow_noop: true
  forbid_disconnection: true

reward:
  w_accessibility: 1.0
  w_flow_concentration: 0.0
  w_equity: 0.0
  w_detour: 0.0
  w_intervention: 0.0
  disconnection_penalty: 5.0
  w_pedestrian_zone: 0.0
  reward_mode: delta
