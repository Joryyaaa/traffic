# Additional Riyadh scenario: Qurtubah district (NE Riyadh, near Princess
# Nora University) -- a different neighborhood from Al Nakheel, in case a
# 2nd Riyadh data point is useful (same city, different sub-network).
#
#   python scripts/fetch_osm_data.py --radius 250 --out data/raw/qurtubah --lat 24.83 --lon 46.75
#   (ESTIMATED coordinate near PNU/Qurtubah -- not confirmed via Google Maps
#   like Al Nakheel/Jeddah were, so check the residential count carefully;
#   adjust lat/lon if it comes back empty like Al Olaya/Al-Kharj/Abha/Tabuk did)
seed: 42

network:
  backend: madina
  streets_path: data/raw/qurtubah/streets.geojson
  origins_path: data/raw/qurtubah/residential.geojson
  destinations_path: data/raw/qurtubah/amenities.geojson
  origin_weight: residents
  destination_weight: floor_area
  weight_attribute: null
  crs: "EPSG:32638"
  node_snapping_tolerance: 0.5

simulation:
  search_radius: 800
  detour_ratio: 1.0
  decay: true
  decay_method: exponent
  beta: 0.003
  closest_destination: false
  turn_penalty: false
  num_cores: 1

action:
  action_type: toggle
  closure_mode: penalize
  closure_penalty: 1000.0
  max_closures: 6
  episode_length: 15
  allow_reopen: false
  allow_noop: true
  forbid_disconnection: true

reward:
  w_accessibility: 1.0
  w_flow_concentration: 0.5
  w_equity: 0.3
  w_detour: 0.2
  w_intervention: 0.05
  disconnection_penalty: 5.0

  w_pedestrian_zone: 1.0
  min_zone_size: 3
  zone_exponent: 2.0

  reward_mode: delta
