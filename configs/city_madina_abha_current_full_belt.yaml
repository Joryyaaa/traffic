# Current Full-Belt Conditions: network-wide accessibility reference.
# Static Madina verification only; no roads are closed and no RL policy runs.
seed: 42

network:
  backend: madina
  streets_path: data/raw/abha_full_belt_s0/streets.geojson
  origins_path: data/raw/abha_full_belt_s0/residential.geojson
  destinations_path: data/raw/abha_full_belt_s0/amenities.geojson
  origin_weight: origin_weight
  destination_weight: floor_area
  weight_attribute: null
  crs: "EPSG:32638"
  node_snapping_tolerance: 0.5
  respect_oneway: true

simulation:
  search_radius: 800
  detour_ratio: 1.0
  decay: true
  decay_method: exponent
  beta: 0.003
  closest_destination: false
  turn_penalty: false
  num_cores: 1

action:
  action_type: toggle
  closure_mode: penalize
  closure_penalty: 1000.0
  max_closures: 0
  episode_length: 1
  allow_reopen: false
  allow_noop: true
  forbid_disconnection: true

reward:
  w_accessibility: 1.0
  w_flow_concentration: 0.0
  w_equity: 0.0
  w_detour: 0.0
  w_intervention: 0.0
  disconnection_penalty: 5.0
  w_pedestrian_zone: 0.0
  reward_mode: delta
