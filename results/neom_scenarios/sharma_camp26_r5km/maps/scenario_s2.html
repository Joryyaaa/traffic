  var p = l.feature.properties;
  return '<b>Camp 26 Parking Hub</b><br>OSM ID: '+p.osm_id;
});

var map = L.map('map', {
  center: [28.03066, 35.24203],
  zoom: 13,
  layers: [streets, origins, dests]
});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'OSM',
  maxZoom: 18
}).addTo(map);

var legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  var div = L.DomUtil.create('div');
  div.innerHTML = '<div class="legend"><div><i style="background:#3388ff"></i> Streets (full network)</div><div><i style="background:#e74c3c"></i> Worker origins (21)</div><div><i style="background:#9b59b6"></i> Camp 26 parking hub (1 dest)</div></div>';
  return div;
};
legend.addTo(map);
</script></body></html>
