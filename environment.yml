name: snrl
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas
  - shapely
  - pyogrio
  - networkx
  - numpy
  - pandas
  - pyyaml
  - pytorch
  - pip
  - pip:
      - gymnasium>=0.29
      - stable-baselines3>=2.3
      - tensorboard
      - pytest
      - -i https://test.pypi.org/simple/
      - --extra-index-url https://pypi.org/simple
      - madina
